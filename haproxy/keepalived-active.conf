# =============================================================
# Keepalived Configuration — ACTIVE (MASTER) Node
# File: /etc/keepalived/keepalived.conf
#
# This runs on the HOST machine (not in Docker)
# to manage the floating VIP between two HAProxy hosts.
# =============================================================

# Health check: is HAProxy process running?
vrrp_script chk_haproxy {
    script   "pidof haproxy"
    interval 2        # check every 2 seconds
    weight   -15      # subtract 15 from priority if check fails
    fall     3        # fail after 3 consecutive failures
    rise     2        # recover after 2 consecutive successes
}

vrrp_instance VI_1 {
    state            MASTER         # MASTER on active node
    interface        eth0           # your network interface (check with: ip link)
    virtual_router_id 51            # unique ID, must match on BOTH nodes
    priority         110            # higher = preferred master (standby uses 100)
    advert_int       1              # send VRRP heartbeat every 1 second

    authentication {
        auth_type PASS
        auth_pass your_secure_vrrp_password   # max 8 chars, same on both nodes
    }

    virtual_ipaddress {
        10.0.0.100/24               # VIP — this floats between active & standby
    }

    track_script {
        chk_haproxy
    }

    # Optional: run scripts on state changes
    notify_master  "/etc/keepalived/notify.sh MASTER"
    notify_backup  "/etc/keepalived/notify.sh BACKUP"
    notify_fault   "/etc/keepalived/notify.sh FAULT"
}
