# =============================================================
# Keepalived Configuration — STANDBY (BACKUP) Node
# File: /etc/keepalived/keepalived.conf
#
# Same as active, only state and priority differ.
# =============================================================

vrrp_script chk_haproxy {
    script   "pidof haproxy"
    interval 2
    weight   -15
    fall     3
    rise     2
}

vrrp_instance VI_1 {
    state            BACKUP         # <-- BACKUP on standby node
    interface        eth0
    virtual_router_id 51            # must match active node
    priority         100            # <-- lower than active (110)
    advert_int       1

    authentication {
        auth_type PASS
        auth_pass your_secure_vrrp_password   # same as active node
    }

    virtual_ipaddress {
        10.0.0.100/24               # same VIP as active node
    }

    track_script {
        chk_haproxy
    }

    notify_master  "/etc/keepalived/notify.sh MASTER"
    notify_backup  "/etc/keepalived/notify.sh BACKUP"
    notify_fault   "/etc/keepalived/notify.sh FAULT"
}
