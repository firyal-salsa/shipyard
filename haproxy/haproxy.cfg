#================================================================
# HAProxy Configuration
# Architecture: Blue-Green + Canary Deployment
# HA: Active/Standby via Keepalived (VRRP) — see keepalived.conf
#================================================================

global
    maxconn     8192
    log         stdout format raw local0 info
    stats socket /tmp/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 2m

defaults
    log         global
    mode        http
    option      httplog
    option      dontlognull
    option      forwardfor          # pass real client IP to backend
    option      http-server-close
    timeout connect 2s
    timeout client  1m
    timeout server  5s


#----------------------------------------------------------------
# FRONTEND — HTTP (redirect to HTTPS)
#----------------------------------------------------------------
frontend http_in
    bind *:80
    mode http
    http-request redirect scheme https code 301

#----------------------------------------------------------------
# FRONTEND — HTTPS with SSL Termination
#----------------------------------------------------------------
frontend https_in
    bind *:443 ssl crt /etc/haproxy/certs/server.pem
    mode http

    # Security headers
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"
    http-response set-header X-Frame-Options SAMEORIGIN
    http-response set-header X-Content-Type-Options nosniff

    # ---[ CANARY ROUTING ]---
    # Option 1: Route by special header (e.g. beta testers)
    acl is_canary_user req.hdr(X-Canary) -m found

    # Option 2: Route by cookie (sticky canary session)
    acl is_canary_cookie req.cook(canary) -m found

    # Send canary users to canary backend
    use_backend canary_backend if is_canary_user OR is_canary_cookie

    # ---[ DEFAULT: Blue-Green routing ]---
    default_backend blue_green_backend

#----------------------------------------------------------------
# BACKEND — Blue-Green
# Blue V1.0 = weight 100 (active)
# Green V1.1 = weight 0  (standby, ready to switch)
#
# To switch: use runtime API (no restart needed!)
#   echo "set weight blue_green_backend/app-green 100" | socat stdio /run/haproxy/admin.sock
#   echo "set weight blue_green_backend/app-blue 0"   | socat stdio /run/haproxy/admin.sock
#----------------------------------------------------------------
backend blue_green_backend
    balance     roundrobin
    mode        http

    # Health check — hits /health endpoint every 2s
    option      httpchk GET /health
    http-check  expect status 200

    server app-blue   app-blue:80   check inter 2s fall 3 rise 2 weight 100
    server app-green  app-green:80  check inter 2s fall 3 rise 2 weight 0

#----------------------------------------------------------------
# BACKEND — Canary
# Canary V1.1 = 5% traffic (gradually increase to 100%)
#
# To increase canary %:
#   echo "set weight canary_backend/app-canary 30" | socat stdio /run/haproxy/admin.sock
#----------------------------------------------------------------
backend canary_backend
    balance     roundrobin
    mode        http

    option      httpchk GET /health
    http-check  expect status 200

    server app-canary app-canary:80 check inter 2s fall 3 rise 2 weight 5

#----------------------------------------------------------------
# STATS — HAProxy Dashboard
# Access at: http://YOUR_IP:9000/stats
#----------------------------------------------------------------
frontend stats
    bind        *:9000
    mode        http
    stats       enable
    stats       uri /stats
    stats       auth admin:admin123       # change in production!
    stats       refresh 5s
    stats       show-legends
    stats       show-node
    monitor-uri /haproxy-health           # simple health endpoint (no auth)
